# .github/workflows/build.yml
name: Build NiziPOS

on:
  push:
    tags:
      - 'v*'           # triggers on v1.0.0, v2.3.1, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (without "v" prefix, e.g. 1.2.3)'
        required: false
        default: ''

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # ── Derive version from the tag ──────────────────────────────────
      # GITEA_REF_NAME is set to the tag name (e.g. "v1.2.3") on tag pushes.
      # Strip the leading "v" to get a plain semver string for package tools.
      # Falls back to the workflow_dispatch input, then to "0.0.0-dev".
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ -n "${GITEA_REF_NAME}" ]; then
            VER="${GITEA_REF_NAME#v}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="0.0.0-dev"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache apt packages
        uses: actions/cache@v3
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            binutils imagemagick libfuse2 \
            squashfs-tools patchelf desktop-file-utils \
            libgdk-pixbuf2.0-dev zsync dpkg-dev \
            rpm zstd

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller build.spec

      # ── .deb (Debian / Ubuntu) ───────────────────────────────────────
      - name: Build .deb package
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./build_deb.sh
          ./build_deb.sh

      # ── .rpm (Fedora / RHEL) ─────────────────────────────────────────
      - name: Build .rpm package
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./build_rpm.sh
          ./build_rpm.sh

      # ── .pkg.tar.zst (Arch) ──────────────────────────────────────────
      - name: Build .tar.zst package
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x ./build_tarzst.sh
          ./build_tarzst.sh

      # ── Upload all packages as a single artifact ─────────────────────
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NiziPOS ${{ steps.version.outputs.version }}
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
